<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <base href="../">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fall Refresh | DARLING HomeOS</title>

    <meta
        name="description"
        content="DARLING HomeOS Fall Refresh"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
        rel="stylesheet"
    >

    <!-- SHARED HOMEOS -->
    <link
        rel="stylesheet"
        href="assets/css/app.css"
    >

    <!-- ALL FOUR SEASON DETAIL PAGES SHARE THIS -->
    <link
        rel="stylesheet"
        href="assets/css/season-deatil.css"
    >
</head>

<body
    data-page="seasonal"
    data-seasonal-view="detail"
    data-season="fall"
>

    <header id="appHeader"></header>

    <main
        class="app-main season-detail-main"
        id="seasonDetailRoot"
    ></main>

    <footer id="appFooter"></footer>

    <div
        class="app-toast"
        id="appToast"
        aria-live="polite"
    ></div>

    <!--
        SCRIPT ORDER MATTERS:

        1. store.js            = one HomeOS memory
        2. app.js              = shared helpers
        3. shell.js            = shared navigation/theme/footer
        4. season-detail.js    = builds the seasonal detail HTML
        5. seasonal.js         = owns tasks/progress/shopping/actions
        6. season-detail-ui.js = live clock/cycle/guide/telemetry

        season-detail-ui.js MUST load after seasonal.js.
    -->
    <script src="assets/js/store.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/shell.js"></script>
    <script src="assets/js/season-detail.js"></script>
    <script src="assets/js/seasonal.js"></script>
    <script src="assets/js/season-detail-ui.js"></script>

</body>
</html>
