<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign In | DARLING HomeOS</title>

    <link
        rel="stylesheet"
        href="assets/css/app.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/auth.css"
    >
</head>


<body class="auth-page">

    <main class="auth-shell">

        <!-- ========================================================
             HOMEOS INTRO
        ========================================================= -->

        <section class="auth-intro">

            <a
                href="login.html"
                class="auth-brand"
                aria-label="DARLING HomeOS"
            >
                <span class="brand-mark">

                    <img
                        src="assets/images/branding/homeos-icon.png"
                        alt=""
                        class="brand-homeos-icon"
                    >

                </span>

                <span class="auth-brand-copy">

                    <span class="auth-brand-name">
                        DARLING
                    </span>

                    <span class="auth-brand-system">
                        HomeOS
                    </span>

                </span>
            </a>


            <div class="auth-intro-copy">

                <p class="auth-kicker">
                    Home Intelligence
                </p>

                <h2 class="auth-intro-title">
                    Your home,
                    intelligently managed.
                </h2>

                <p class="auth-intro-text">
                    One connected system for the rhythms,
                    routines and intelligence that keep your
                    home moving.
                </p>

            </div>


            <div class="auth-system-status">
                Secure HomeOS access
            </div>

        </section>


        <!-- ========================================================
             LOGIN
        ========================================================= -->

        <section class="auth-panel">

            <div class="auth-panel-inner">

                <h1>Welcome back.</h1>

                <p class="auth-panel-lead">
                    Sign in to continue to your HomeOS.
                </p>


                <form
                    id="login-form"
                    class="auth-form"
                >

                    <div class="app-field">

                        <label for="email">
                            Email
                        </label>

                        <input
                            class="app-input"
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="app-field">

                        <label for="password">
                            Password
                        </label>

                        <input
                            class="app-input"
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <button
                        class="button button-primary auth-submit"
                        id="login-button"
                        type="submit"
                    >
                        Sign In
                    </button>


                    <div
                        id="login-message"
                        class="auth-message"
                        aria-live="polite"
                    ></div>

                </form>


                <p class="auth-switch">
                    New to HomeOS?
                    <a href="signup.html">
                        Create your account
                    </a>
                </p>

            </div>

        </section>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="assets/js/supabase.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/auth-page.js"></script>

</body>

</html>
